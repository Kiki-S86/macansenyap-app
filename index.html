<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Macan Senyap - System</title>
    <!-- Wajib menyertakan script Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Font Terminal -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #00ffff;
            --bg-color: #050505;
            --panel-bg: rgba(0, 255, 65, 0.05);
            --border-color: rgba(0, 255, 65, 0.3);
            --text-color: #e0e0e0;
            --danger: #ff003c;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Share Tech Mono', monospace; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--neon-green);
            padding: 15px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Efek Garis Scanning Monitor */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 10px var(--panel-bg), inset 0 0 10px var(--panel-bg);
            position: relative;
        }

        .header h1 {
            font-size: 22px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-green);
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-color);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .header::before {
            content: "[ SYSTEM ACTIVE ]";
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            background: var(--bg-color);
            padding: 0 10px;
            font-size: 10px;
            color: var(--neon-green);
            letter-spacing: 2px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .tool-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }

        .tool-card:active {
            background-color: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 15px var(--neon-green);
            transform: scale(0.98);
        }

        .tool-card::after {
            content: "";
            position: absolute;
            bottom: 0; right: 0;
            width: 10px; height: 10px;
            background: var(--neon-green);
        }

        .tool-icon {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 0 5px var(--neon-green));
        }

        .tool-title {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--neon-green);
        }

        /* Form Input Terminal */
        #input-section {
            display: none;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            position: relative;
            box-shadow: 0 0 15px var(--panel-bg);
            animation: glitchIn 0.3s;
        }

        @keyframes glitchIn {
            0% { transform: translateX(-5px); opacity: 0; }
            50% { transform: translateX(5px); }
            100% { transform: translateX(0); opacity: 1; }
        }

        .form-title {
            font-size: 16px;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
            letter-spacing: 1px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #000;
            border: 1px solid var(--border-color);
            padding: 10px;
            margin-bottom: 15px;
        }

        .prompt {
            color: var(--neon-cyan);
            margin-right: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: rgba(0, 255, 65, 0.3);
        }

        button.btn-execute {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }

        button.btn-execute:active {
            background-color: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
        }

        button.btn-cancel {
            width: 100%;
            padding: 10px;
            background-color: transparent;
            border: none;
            color: var(--danger);
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
            text-decoration: underline;
            letter-spacing: 1px;
        }

        /* Footer Status */
        .footer-status {
            text-align: center;
            font-size: 10px;
            color: rgba(0, 255, 65, 0.5);
            margin-top: 30px;
            letter-spacing: 1px;
        }
        
        /* Efek Blinking Cursor */
        .cursor::after {
            content: "_";
            animation: blink 1s step-start infinite;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="cursor">MACAN SENYAP</h1>
        <p id="greeting">INITIALIZING SYSTEM...</p>
    </div>

    <!-- Menu Grid -->
    <div class="grid-menu" id="menu-grid">
        <div class="tool-card" onclick="pilihFitur('CEK NIK', 'ENTER 16-DIGIT NIK')">
            <span class="tool-icon">🆔</span>
            <div class="tool-title">CEK_NIK</div>
        </div>
        <div class="tool-card" onclick="pilihFitur('NIK FOTO', 'ENTER 16-DIGIT NIK')">
            <span class="tool-icon">📸</span>
            <div class="tool-title">NIK_FOTO</div>
        </div>
        <div class="tool-card" onclick="pilihFitur('CEK NAMA', 'ENTER FULL NAME')">
            <span class="tool-icon">👤</span>
            <div class="tool-title">CEK_NAMA</div>
        </div>
        <div class="tool-card" onclick="pilihFitur('DATA BOCOR', 'ENTER NIK / QUERY')">
            <span class="tool-icon">💀</span>
            <div class="tool-title">DATA_BOCOR</div>
        </div>
        <div class="tool-card" onclick="pilihFitur('GETCONTACT', 'ENTER PHONE NUMBER')">
            <span class="tool-icon">📞</span>
            <div class="tool-title">GETCONTACT</div>
        </div>
        <div class="tool-card" onclick="pilihFitur('CEK PLAT', 'ENTER PLATE NUMBER')">
            <span class="tool-icon">🚘</span>
            <div class="tool-title">CEK_PLAT</div>
        </div>
        <div class="tool-card" onclick="pilihFitur('CEK POSISI', 'ENTER PHONE NUMBER')">
            <span class="tool-icon">📍</span>
            <div class="tool-title">CEK_POSISI</div>
        </div>
        <div class="tool-card" onclick="pilihFitur('CEK KK', 'ENTER 16-DIGIT KK')">
            <span class="tool-icon">👨‍👩‍👧‍👦</span>
            <div class="tool-title">CEK_KK</div>
        </div>
    </div>

    <!-- Form Input Terminal -->
    <div id="input-section">
        <div class="form-title" id="form-title">>_ EXECUTING MODULE...</div>
        
        <div class="input-wrapper">
            <span class="prompt">C:\></span>
            <input type="text" id="input-data" placeholder="TYPE HERE..." autocomplete="off" autofocus>
        </div>
        
        <button class="btn-execute" onclick="kirimKeBot()">[ RUN COMMAND ]</button>
        <button class="btn-cancel" onclick="tutupForm()">[ ABORT ]</button>
    </div>

    <div class="footer-status">
        SECURE CONNECTION ESTABLISHED<br>
        v2.0.26 | @Macansenyap86
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready();

        // Tampilkan user (simulasi hacking login)
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('greeting').innerText = `USER: ${user.first_name.toUpperCase()} | ACCESS GRANTED`;
        } else {
            document.getElementById('greeting').innerText = "USER: UNKNOWN | GUEST ACCESS";
        }

        let fiturAktif = "";

        function pilihFitur(namaFitur, placeholderText) {
            fiturAktif = namaFitur;
            
            document.getElementById('menu-grid').style.display = 'none';
            document.getElementById('input-section').style.display = 'block';
            document.getElementById('form-title').innerText = `>_ TARGET: ${namaFitur}`;
            
            let inputEl = document.getElementById('input-data');
            inputEl.placeholder = placeholderText;
            inputEl.value = "";
            inputEl.focus();
        }

        function tutupForm() {
            document.getElementById('menu-grid').style.display = 'grid';
            document.getElementById('input-section').style.display = 'none';
        }

        function kirimKeBot() {
            let dataInput = document.getElementById('input-data').value.trim();
            
            if (dataInput === "") {
                tg.showAlert("⚠️ ERROR: INPUT CANNOT BE EMPTY");
                return;
            }

            // Animasi Loading Terminal
            const btn = document.querySelector('.btn-execute');
            btn.innerText = "[ UPLOADING DATA... ]";
            btn.style.color = "var(--neon-cyan)";
            btn.style.borderColor = "var(--neon-cyan)";

            // Kirim data ke Python Bot
            const dataKirim = {
                action: "execute_feature",
                feature: fiturAktif,
                query: dataInput
            };

            setTimeout(() => {
                tg.sendData(JSON.stringify(dataKirim));
                tg.close();
            }, 500); // Delay dikit biar efek loadingnya kelihatan keren
        }
    </script>
</body>
</html>
