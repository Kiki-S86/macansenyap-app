<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Macan Senyap - Polaris X</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #040811; --panel-bg: rgba(8, 17, 32, 0.95); --cyan: #00e5ff; --cyan-glow: rgba(0, 229, 255, 0.4); --orange: #ff9900; --text: #e0f7fa; --border: rgba(0, 229, 255, 0.2); --danger: #ff003c; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-deep); color: var(--text); height: 100vh; width: 100vw; overflow: hidden; font-family: 'Share Tech Mono', monospace; background-image: radial-gradient(circle at 50% 50%, #0a1930 0%, #040811 100%); }
        .radar-bg { position: absolute; top: 50%; left: 50%; width: 150vw; height: 150vw; margin-top: -75vw; margin-left: -75vw; border-radius: 50%; border: 1px solid rgba(0, 229, 255, 0.1); z-index: 0; }
        .radar-sweep { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, rgba(0, 229, 255, 0.15) 60deg, transparent 60deg); animation: rotate 5s linear infinite; }
        @keyframes rotate { to { transform: rotate(360deg); } }
        .ui-layer { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); background: var(--panel-bg); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: bold; color: var(--cyan); letter-spacing: 2px; text-shadow: 0 0 10px var(--cyan-glow); }
        .content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 11px; color: var(--cyan); letter-spacing: 1px; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tool-card { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; position: relative; }
        .tool-card:active { background: rgba(0, 229, 255, 0.1); border-color: var(--cyan); }
        .tool-icon { font-size: 22px; }
        .tool-name { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; }
        .tool-price { font-size: 10px; color: var(--orange); background: rgba(255, 153, 0, 0.1); padding: 2px 6px; border-radius: 4px; }
        .footer { background: var(--panel-bg); border-top: 1px solid var(--border); padding: 12px; display: flex; justify-content: space-around; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #4a5c6e; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--cyan); }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 8, 17, 0.95); z-index: 50; display: none; flex-direction: column; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-box { background: var(--panel-bg); border: 1px solid var(--cyan); border-radius: 12px; padding: 20px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.15); width: 100%; }
        .input-label { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--cyan); margin-bottom: 15px; text-align: center; }
        .terminal-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 16px; padding: 12px; outline: none; text-align: center; margin-bottom: 15px; }
        .btn-action { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); border-radius: 6px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 12px; margin-bottom: 10px; }
        .btn-cancel { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 12px; }
        #loading-text { text-align: center; color: var(--cyan); font-size: 14px; margin-bottom: 20px; animation: blink 1s infinite;}
        @keyframes blink { 50% { opacity: 0.5; } }
        .result-container { max-height: 60vh; overflow-y: auto; border: 1px solid var(--border); padding: 15px; background: #000; border-radius: 8px; margin-bottom: 15px; }
        .result-item { margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        .result-key { color: var(--orange); font-size: 12px; }
        .result-val { color: #fff; font-size: 14px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="radar-bg"><div class="radar-sweep"></div></div>

    <div class="ui-layer">
        <div class="header">
            <div class="logo">POLARIS-X</div>
        </div>

        <div class="content">
            <div class="section-title">GLOBAL INTELLIGENCE MODULES</div>
            <div class="grid">
                <div class="tool-card" onclick="pilihFitur('CEK NIK', 'nik', 'ENTER 16-DIGIT NIK')"><div class="tool-icon">🆔</div><div class="tool-name">CEK NIK</div><div class="tool-price">2 TOKEN</div></div>
                <div class="tool-card" onclick="pilihFitur('NIK FOTO', 'nik', 'ENTER 16-DIGIT NIK')"><div class="tool-icon">📸</div><div class="tool-name">NIK FOTO</div><div class="tool-price">5 TOKEN</div></div>
                <div class="tool-card" onclick="pilihFitur('CEK NAMA', 'nama', 'ENTER FULL NAME')"><div class="tool-icon">👤</div><div class="tool-name">CEK NAMA</div><div class="tool-price">5 TOKEN</div></div>
                <div class="tool-card" onclick="pilihFitur('DATA BOCOR', 'q', 'ENTER NIK / QUERY')"><div class="tool-icon">💀</div><div class="tool-name">DATA BOCOR</div><div class="tool-price">5 TOKEN</div></div>
                <div class="tool-card" onclick="pilihFitur('GETCONTACT', 'nomor', 'ENTER PHONE NUMBER')"><div class="tool-icon">📞</div><div class="tool-name">GETCONTACT</div><div class="tool-price">5 TOKEN</div></div>
                <div class="tool-card" onclick="pilihFitur('CEK PLAT', 'plat', 'ENTER PLATE NUMBER')"><div class="tool-icon">🚘</div><div class="tool-name">CEK PLAT</div><div class="tool-price">5 TOKEN</div></div>
                <div class="tool-card" onclick="pilihFitur('CEK POSISI', 'phone', 'ENTER PHONE NUMBER')"><div class="tool-icon">📍</div><div class="tool-name">CEK POSISI</div><div class="tool-price">60 TOKEN</div></div>
                <div class="tool-card" onclick="pilihFitur('CEK KK', 'nokk', 'ENTER 16-DIGIT KK')"><div class="tool-icon">👨‍👩‍👧‍👦</div><div class="tool-name">CEK KK</div><div class="tool-price">5 TOKEN</div></div>
            </div>
        </div>

        <div class="footer">
            <div class="nav-item active"><div class="nav-icon">🌐</div> DASHBOARD</div>
            <div class="nav-item" onclick="tg.close()"><div class="nav-icon">💬</div> CHAT</div>
        </div>
    </div>

    <!-- Input Overlay -->
    <div id="input-overlay" class="overlay">
        <div class="modal-box">
            <div class="input-label" id="input-label">>_ INITIATE SCAN</div>
            <input type="text" class="terminal-input" id="input-data" placeholder="ENTER TARGET..." autocomplete="off">
            <button class="btn-action" onclick="prosesData()">[ SCAN TARGET ]</button>
            <button class="btn-cancel" onclick="tutupForm()">[ ABORT MISSION ]</button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="overlay">
        <div class="modal-box" style="text-align: center;">
            <div id="loading-text">> BYPASSING FIREWALL... PLEASE WAIT...</div>
        </div>
    </div>

    <!-- Result Overlay -->
    <div id="result-overlay" class="overlay">
        <div class="modal-box">
            <div class="input-label" style="color: var(--orange);">🔍 INTELLIGENCE REPORT</div>
            <div class="result-container" id="result-box">
                <!-- Data akan diisi oleh JS -->
            </div>
            <button class="btn-action" onclick="kembaliKeMenu()">[ RETURN TO DASHBOARD ]</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready();

        // KONFIGURASI API KAMU
        const BASE_URL = "https://typically-bonus-ultram-appearance.trycloudflare.com";
        const API_KEY = "b0ceb952376259b4ef6562ec4a9b2b66";
        const ENDPOINTS = {
            "CEK NIK": "/api/cek_nik", "NIK FOTO": "/api/nikfoto", "CEK NAMA": "/api/cek_nama",
            "DATA BOCOR": "/api/data-bocor", "GETCONTACT": "/api/getcontact", "CEK PLAT": "/api/nopol",
            "CEK POSISI": "/api/cekpos", "CEK KK": "/api/kk"
        };

        let fiturAktif = "";
        let paramAktif = "";

        function pilihFitur(namaFitur, param, placeholder) {
            fiturAktif = namaFitur;
            paramAktif = param;
            document.getElementById('input-overlay').style.display = 'flex';
            document.getElementById('input-label').innerText = `>_ TARGET: ${namaFitur}`;
            document.getElementById('input-data').placeholder = placeholder;
            document.getElementById('input-data').value = "";
            document.getElementById('input-data').focus();
        }

        function tutupForm() {
            document.getElementById('input-overlay').style.display = 'none';
        }

        function kembaliKeMenu() {
            document.getElementById('result-overlay').style.display = 'none';
        }

        async function prosesData() {
            let query = document.getElementById('input-data').value.trim();
            if (query === "") { tg.showAlert("⚠️ TARGET DATA REQUIRED"); return; }

            document.getElementById('input-overlay').style.display = 'none';
            document.getElementById('loading-overlay').style.display = 'flex';

            // 1. Mini App Ambil Data Sendiri
            const endpoint = ENDPOINTS[fiturAktif];
            const url = `${BASE_URL}${endpoint}?${paramAktif}=${query}&key=${API_KEY}`;

            try {
                let response = await fetch(url);
                let json = await response.json();

                document.getElementById('loading-overlay').style.display = 'none';
                tampilkanHasil(json);

                // 2. Kirim Sinyal ke Bot HANYA UNTUK POTONG SALDO (Data di bot akan sunyi)
                tg.sendData(JSON.stringify({ 
                    action: "execute_feature", 
                    feature: fiturAktif, 
                    query: query 
                }));

            } catch (error) {
                document.getElementById('loading-overlay').style.display = 'none';
                tg.showAlert("❌ KONEKSI DITOLAK: Server API tidak merespon.");
            }
        }

        function tampilkanHasil(data) {
            let container = document.getElementById('result-box');
            container.innerHTML = '';

            if (data.success === false || data.status === "error") {
                container.innerHTML = `<div style="color: red; text-align: center;">❌ TARGET NOT FOUND<br><br>${data.message || 'Data tidak ditemukan'}</div>`;
            } else {
                let mainData = data.data ? data.data : data;
                if (Array.isArray(mainData)) mainData = mainData[0]; // Ambil data pertama jika list

                for (let key in mainData) {
                    if (key === 'foto' || key === 'foto_ktp') continue; 
                    let value = mainData[key];
                    if (!value || value === "") value = "-";
                    let formattedKey = key.replace(/_/g, ' ').toUpperCase();
                    container.innerHTML += `
                        <div class="result-item">
                            <div class="result-key">${formattedKey}</div>
                            <div class="result-val">${value}</div>
                        </div>
                    `;
                }
            }
            document.getElementById('result-overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
